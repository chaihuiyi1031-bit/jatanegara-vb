<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>i-Jati 1.5.42 - UI Logic Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', 'Roboto', sans-serif; }
        
        #status-bar {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 15, 15, 0.92); border: 1px solid #cca43b;
            border-radius: 12px; color: #fff; width: 280px; padding: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }
        .btn-ctrl { 
            width: 100%; background: transparent; border: 1px solid #cca43b; 
            color: #cca43b; padding: 10px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: bold; margin-bottom: 10px; transition: 0.2s;
        }
        .btn-ctrl:hover { background: #cca43b; color: #000; }
        
        #info-panel {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 70%; max-width: 800px;
            background: rgba(15, 15, 15, 0.95); border: 2px solid #444; 
            border-radius: 18px; padding: 45px 35px;
            text-align: center; color: #fff; opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            backdrop-filter: blur(15px); pointer-events: none;
        }
        #info-panel.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        #info-title { margin: 0 0 20px 0; color: #cca43b; font-size: 38px; font-weight: bold; }
        #info-desc { margin: 0; font-size: 26px; line-height: 1.6; color: #555; }
        .kw-locked { color: #666; text-decoration: underline dotted #444; }
        .kw-found { color: #cca43b; font-weight: bold; text-shadow: 0 0 10px rgba(204,164,59,0.5); }
        
        #victory-screen {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(145deg, rgba(30,30,30,0.98), rgba(10,10,10,0.98));
            border: 3px solid #cca43b; border-radius: 40px;
            padding: 60px 100px; text-align: center;
            box-shadow: 0 0 80px rgba(204,164,59,0.4), inset 0 0 20px rgba(204,164,59,0.2);
            z-index: 3000; opacity: 0; pointer-events: none;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(20px);
        }
        #victory-screen.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        #victory-screen h1 { 
            margin: 0; font-size: 72px; letter-spacing: 5px;
            background: linear-gradient(to bottom, #fff 20%, #cca43b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(204,164,59,0.5));
        }
        #victory-screen p { font-size: 22px; color: #aaa; margin: 20px 0 40px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        #btn-replay-ui {
            display: inline-block; padding: 20px 50px;
            border: 2px solid #cca43b; border-radius: 50px;
            color: #cca43b; font-size: 18px; font-weight: bold;
            transition: all 0.3s; position: relative;
        }
        #btn-replay-ui.hovered { background: #cca43b; color: #000; transform: scale(1.1); box-shadow: 0 0 30px #cca43b; }

        #mic-status { color: #ff4444; font-weight: bold; display: none; animation: blink 1s infinite; margin-top: 5px; }
        @keyframes blink { 50% { opacity: 0.3; } }
        #flash-effect { position: fixed; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; pointer-events: none; z-index: 2000; }
    </style>
</head>
<body>

<div id="flash-effect"></div>

<div id="victory-screen">
    <div style="font-size: 50px; margin-bottom: 10px;">🏆</div>
    <h1>SYABAS!</h1>
    <p>Semangat Jati Diri Telah Diaktifkan</p>
    <div id="btn-replay-ui">MAIN SEMULA</div>
    <div style="margin-top: 15px; font-size: 12px; color: #555;">Gunakan isyarat CUBIT untuk pilih</div>
</div>

<div id="status-bar">
    <b style="color:#cca43b; font-size: 16px;">Jata Negara</b>
    <hr style="border:0.5px solid #333; margin:10px 0;">
    <button class="btn-ctrl" onclick="toggleFullScreen()">MOD SKRIN PENUH</button>
    <div style="font-size: 12px; color: #bbb;">🖐️ Buka | 🤏 Cubit (Pilih) | ✊ Genggam</div>
    <div id="mic-status">🎤 MENDENGAR...</div>
</div>

<div id="info-panel">
    <h2 id="info-title">Tajuk</h2>
    <div id="info-desc"></div>
</div>

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const APPLAUSE_URL = "https://assets.mixkit.co/active_storage/sfx/2012/2012-preview.mp3";

    function playDing() {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- 新增：錯誤音效函數 ---
    function playErrorSound() {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
    
    function playVictorySound() {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        const audio = new Audio(APPLAUSE_URL); audio.volume = 0.6; audio.play();
    }

    const OFFSET_Y = 25;
    const RIBBON_ZOOM = 0.8;
    const JATA_URL = "https://upload.wikimedia.org/wikipedia/commons/2/26/Coat_of_arms_of_Malaysia.svg";

    let scene, camera, renderer, particles, particleMeta = [];
    let cursor, currentState = 'IDLE', selectedGroupId = -1, hoveredGroupId = -1;
    let morphFactor = 0, selectFactor = 0, groupCenters = {};
    let isVictory = false;

    const GAME_DATA = {
        0: { name: "⭐ Bulan dan Bintang", kws: ["13 Buah Negeri", "Kerajaan Persekutuan", "Agama Islam"], status: [false, false, false], desc: "Melambangkan perpaduan {0} dan {1} serta {2}." },
        8: { name: "🟥 Lima Bilah Keris", kws: ["Tidak Bersekutu"], status: [false], desc: "Mewakili Negeri-negeri Melayu {0}." },
        7: { name: "🛡️ Empat Jalur", kws: ["Bersekutu"], status: [false], desc: "Mewakili Negeri-negeri Melayu {0}." },
        1: { name: "🌳 Pokok Pulau Pinang", kws: ["Pulau Pinang"], status: [false], desc: "Mewakili negeri {0}." },
        2: { name: "🌳 Pokok Melaka", kws: ["Melaka"], status: [false], desc: "Mewakili negeri {0}." },
        3: { name: "🛡️ Zon Borneo dan Bunga Raya", kws: ["Sabah", "Bunga Kebangsaan", "Sarawak"], status: [false, false, false], desc: "Mewakili {0}, {1} dan {2}." },
        4: { name: "🎗️ Cogan Kata", kws: ["Bersekutu Bertambah Mutu"], status: [false], desc: "Cogan Kata: {0}" },
        5: { name: "🐅 Harimau", kws: ["Keberanian"], status: [false], desc: "Melambangkan {0}." }
    };

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new Recognition();
    rec.lang = 'ms-MY'; rec.continuous = true; rec.interimResults = false;

    rec.onresult = (e) => {
        if (selectedGroupId === -1) return;
        const lastIndex = e.results.length - 1;
        const speech = e.results[lastIndex][0].transcript.toLowerCase();
        const data = GAME_DATA[selectedGroupId];
        
        let matchedSomething = false; // 新增判斷
        data.kws.forEach((kw, idx) => {
            const lowKw = kw.toLowerCase();
            let isMatch = speech.includes(lowKw);
            if (lowKw === "sabah" && !isMatch) { if (speech.includes("saba") || speech.includes("sabar")) isMatch = true; }
            
            if (isMatch) {
                matchedSomething = true; // 標記為匹配成功
                if (!data.status[idx]) { data.status[idx] = true; playDing(); }
            }
        });
        
        // --- 新增：如果不匹配則播放錯誤音 ---
        if (!matchedSomething) { playErrorSound(); }
        
        updateInfoPanelUI();
    };

    function checkAllUnlocked() { return Object.values(GAME_DATA).every(group => group.status.every(s => s === true)); }

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 1, 5000);
        camera.position.z = 850;
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        const cursorGeo = new THREE.RingGeometry(18, 24, 32);
        cursor = new THREE.Mesh(cursorGeo, new THREE.MeshBasicMaterial({ color: 0xffcc33, transparent: true, opacity: 0 }));
        scene.add(cursor);
        const img = new Image(); img.crossOrigin = "anonymous"; img.src = JATA_URL;
        img.onload = () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            const size = 512, h = size * (img.height/img.width);
            canvas.width = size; canvas.height = h; ctx.drawImage(img, 0, 0, size, h);
            const data = ctx.getImageData(0,0,size,h).data;
            const pos = [], col = [];
            for(let y=0; y<h; y++){ 
                for(let x=0; x<size; x++){
                    let i = (y*size + x)*4;
                    if(data[i+3] > 180){
                        let vx = x - size/2, vy = -(y - h/2) - 60; pos.push(vx, vy, 0);
                        const r = data[i]/255, g = data[i+1]/255, b = data[i+2]/255; col.push(r, g, b);
                        let dx = vx, dy = vy, gid = 7; const nx = x/size, ny = y/h;
                        const isY = (data[i] > 160 && data[i+1] > 140 && data[i] > data[i+2]);
                        if (isY && ny <= 0.30 && nx > 0.38 && nx < 0.62) { dy += 120; gid = 0; } 
                        else if ((nx >= 0.30 && nx <= 0.70) && (ny > 0.30 && ny <= 0.458)) { dy += 60; gid = 8; }
                        else if ((nx >= 0.29 && nx <= 0.37) && (ny >= 0.458 && ny <= 0.75)) { dx -= 70; gid = 1; }
                        else if ((nx >= 0.63 && nx <= 0.71) && (ny >= 0.458 && ny <= 0.75)) { dx += 70; gid = 2; }
                        else if ((nx >= 0.30 && nx <= 0.70) && (ny >= 0.64 && ny <= 0.88)) { dy -= 60; gid = 3; }
                        else if (isY && ny > 0.65) {
                            let isRib = (nx > 0.35 && nx < 0.65 && ny > 0.83) || ((nx > 0.22 && nx <= 0.35 || nx >= 0.65 && nx < 0.78) && ny > 0.71) || (nx <= 0.22 || nx >= 0.78) && ny > 0.68;
                            if (isRib) { dy -= 120; gid = 4; }
                        }
                        if (gid === 7 && !(nx >= 0.30 && nx <= 0.70 && ny >= 0.31 && ny <= 0.88)) { if (nx < 0.5) dx -= 150; else dx += 150; gid = 5; }
                        if(!groupCenters[gid]) groupCenters[gid] = {x:0, y:0, count:0};
                        groupCenters[gid].x += dx; groupCenters[gid].y += dy; groupCenters[gid].count++;
                        particleMeta.push({ox:vx, oy:vy, oz:0, dx, dy, gid, isDetail:(x%2!==0||y%2!==0), r, g, b});
                    }
                }
            }
            for(let g in groupCenters) { groupCenters[g].x /= groupCenters[g].count; groupCenters[g].y /= groupCenters[g].count; }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({size: 2.8, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending}));
            scene.add(particles); setupGesture();
        };
        animate();
    }

    function setupGesture() {
        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(res => {
            if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                const hand = res.multiHandLandmarks[0];
                const indexTip = hand[8], thumbTip = hand[4], wrist = hand[0];
                const screenX = (1 - indexTip.x) * window.innerWidth;
                const screenY = indexTip.y * window.innerHeight;
                cursor.position.x = -(indexTip.x-0.5)*1100;
                cursor.position.y = -(indexTip.y-0.5)*800;
                const pinchDist = Math.sqrt(Math.pow(thumbTip.x-indexTip.x,2)+Math.pow(thumbTip.y-indexTip.y,2));
                let openDist = 0; [8,12,16,20].forEach(idx => { openDist += Math.sqrt(Math.pow(hand[idx].x-wrist.x,2)+Math.pow(hand[idx].y-wrist.y,2)); });
                const avgOpen = openDist/4;

                if (isVictory) {
                    const btn = document.getElementById('btn-replay-ui');
                    const rect = btn.getBoundingClientRect();
                    const isOverBtn = (screenX >= rect.left && screenX <= rect.right && screenY >= rect.top && screenY <= rect.bottom);
                    if (isOverBtn) {
                        btn.classList.add('hovered');
                        cursor.material.opacity = 1.0;
                        if (pinchDist < 0.06) { 
                            playDing(); 
                            setTimeout(() => location.reload(), 300); 
                        }
                    } else {
                        btn.classList.remove('hovered');
                        cursor.material.opacity = 0.5;
                    }
                } else {
                    if (avgOpen < 0.2) { 
                        if(currentState !== 'IDLE') { 
                            if (checkAllUnlocked()) { isVictory = true; playVictorySound(); document.getElementById('victory-screen').classList.add('active'); }
                            currentState = 'IDLE'; selectedGroupId = -1; cursor.material.opacity = 0; rec.stop(); document.getElementById('mic-status').style.display='none'; 
                        } 
                    } else if (pinchDist < 0.06) { 
                        if (currentState === 'EXPLODED' && hoveredGroupId !== -1) { selectedGroupId = hoveredGroupId; currentState = 'SELECTED'; cursor.material.opacity = 0; try { audioCtx.resume(); rec.start(); document.getElementById('mic-status').style.display='block'; } catch(e){} } 
                    } else if (pinchDist < 0.15) { 
                        if (currentState === 'EXPLODED') { cursor.material.opacity = 1.0; let minD = 999999; particleMeta.forEach(m => { let d = Math.pow(m.dx - cursor.position.x, 2) + Math.pow(m.dy - cursor.position.y, 2); if(d < minD) { minD = d; hoveredGroupId = m.gid; } }); } 
                    } else if (avgOpen > 0.35) { 
                        if(currentState !== 'EXPLODED') { currentState = 'EXPLODED'; selectedGroupId = -1; cursor.material.opacity = 0; rec.stop(); document.getElementById('mic-status').style.display='none'; } 
                    }
                    updateInfoPanelUI(); 
                }
            }
        });
        const video = document.createElement('video');
        new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 640, height: 480 }).start();
    }

    function animate() {
        requestAnimationFrame(animate);
        if(particles){
            morphFactor += (((currentState === 'EXPLODED' || currentState === 'SELECTED') ? 1 : 0) - morphFactor) * 0.1;
            selectFactor += ((currentState === 'SELECTED' ? 1 : 0) - selectFactor) * 0.1;
            const pos = particles.geometry.attributes.position, col = particles.geometry.attributes.color;
            for(let i=0; i<particleMeta.length; i++){
                const m = particleMeta[i];
                if (m.isDetail && (selectedGroupId === -1 || m.gid !== selectedGroupId || m.gid === 5)) { pos.setXYZ(i, 0, 0, -5000); continue; }
                let isFullUnlocked = GAME_DATA[m.gid].status.every(s => s === true);
                let finalR = m.r, finalG = m.g, finalB = m.b, brightness = 1.0;
                if (!isFullUnlocked) { const gray = (m.r + m.g + m.b) / 3; finalR = finalG = finalB = gray; brightness = 0.4; }
                if (selectedGroupId !== -1 && m.gid !== selectedGroupId) brightness *= 0.2;
                col.setXYZ(i, finalR * brightness, finalG * brightness, finalB * brightness);
                let tx = m.ox + (m.dx - m.ox) * morphFactor, ty = m.oy + (m.dy - m.oy) * morphFactor, tz = 0;
                if (selectedGroupId !== -1 && m.gid === selectedGroupId) {
                    const center = groupCenters[selectedGroupId];
                    let zoom = (m.gid === 5) ? 0.5 : (m.gid === 4 ? RIBBON_ZOOM : 1.4);
                    tz = 500 * selectFactor;
                    tx = (m.dx * (1 - selectFactor)) + ((m.dx - center.x) * zoom * selectFactor);
                    ty = (m.dy * (1 - selectFactor)) + ((m.dy - center.y) * zoom * selectFactor) + (OFFSET_Y * selectFactor);
                } else if (selectedGroupId !== -1) { tz = -400 * selectFactor; }
                pos.setXYZ(i, tx, ty, tz);
            }
            pos.needsUpdate = true; col.needsUpdate = true;
        }
        renderer.render(scene, camera);
    }

    function updateInfoPanelUI() {
        const panel = document.getElementById('info-panel');
        if (selectedGroupId !== -1) {
            const data = GAME_DATA[selectedGroupId];
            document.getElementById('info-title').innerText = data.name;
            let displayDesc = data.desc;
            data.kws.forEach((kw, idx) => {
                const style = data.status[idx] ? "kw-found" : "kw-locked";
                const label = data.status[idx] ? kw : "( ? )";
                displayDesc = displayDesc.replace(`{${idx}}`, `<span class="${style}">${label}</span>`);
            });
            document.getElementById('info-desc').innerHTML = displayDesc;
            panel.classList.add('active');
        } else { panel.classList.remove('active'); }
    }
    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    }
    window.onload = init;
</script>
</body>
</html>
